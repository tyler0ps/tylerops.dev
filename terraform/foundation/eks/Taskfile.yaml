version: "3"

vars:
  CLUSTER_NAME: eks-foundation
  REGION: ap-southeast-1

tasks:
  up-cluster:
    desc: "Pass 1 — EKS cluster + IAM only (first-ever apply, before helm/manifests)"
    cmds:
      - terraform apply -auto-approve
          -target=module.eks_karpenter
          -target=module.aws_lbc_pod_identity
          -target=aws_iam_role.cert_manager
          -target=aws_iam_policy.cert_manager_route53
          -target=aws_iam_role_policy_attachment.cert_manager_route53
          -target=aws_iam_role.external_dns
          -target=aws_iam_policy.external_dns_route53
          -target=aws_iam_role_policy_attachment.external_dns_route53
      - aws eks update-kubeconfig --name {{.CLUSTER_NAME}} --region {{.REGION}}

  up:
    desc: "Full bootstrap — cluster + all helm releases + manifests"
    cmds:
      - terraform apply -auto-approve

  down:
    desc: "Full teardown — Gateway/NLB cleaned up before helm releases"
    cmds:
      - terraform destroy -auto-approve

  kubeconfig:
    desc: "Update local kubeconfig"
    cmds:
      - aws eks update-kubeconfig --name {{.CLUSTER_NAME}} --region {{.REGION}}

  init:
    desc: "Terraform init"
    cmds:
      - terraform init -upgrade

  plan:
    desc: "Terraform plan"
    cmds:
      - terraform plan

  fmt:
    desc: "Format Terraform files"
    cmds:
      - terraform fmt -recursive

  status:
    desc: "Show status of all bootstrap components"
    cmds:
      - echo "=== Helm Releases ==="
      - helm list -A
      - echo ""
      - echo "=== Gateway ==="
      - kubectl get gateway -A
      - echo ""
      - echo "=== Certificates ==="
      - kubectl get certificate -A
      - echo ""
      - echo "=== NLB Service ==="
      - kubectl get svc -n envoy-gateway-system

  check-cert:
    desc: "Check wildcard certificate status"
    cmds:
      - kubectl describe certificate tylerops-dev-tls -n envoy-gateway-system

  logs-lbc:
    desc: "Stream AWS Load Balancer Controller logs"
    cmds:
      - kubectl logs -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller -f

  logs-cert-manager:
    desc: "Stream cert-manager controller logs"
    cmds:
      - kubectl logs -n cert-manager -l app.kubernetes.io/component=controller -f
