version: 3

# apply_requirements enforced on all projects:
#   approved   — PR must have at least 1 approval (configure GitHub branch protection
#                to restrict approvers to owner only)
#   mergeable  — PR must have no conflicts and pass all required status checks
#
# To restrict atlantis apply to owner only:
#   GitHub repo Settings → Branches → branch protection on main:
#     - Require pull request reviews before merging
#     - Restrict who can approve: tyler0ps

projects:
  - name: organization
    dir: terraform/foundation/organization
    apply_requirements:
      - approved
      - mergeable
    autoplan:
      when_modified:
        - "**/*.tf"
      enabled: true

  - name: networking
    dir: terraform/foundation/networking
    apply_requirements:
      - approved
      - mergeable
    autoplan:
      when_modified:
        - "**/*.tf"
      enabled: true

  - name: eks
    dir: terraform/foundation/eks
    apply_requirements:
      - approved
      - mergeable
    autoplan:
      when_modified:
        - "**/*.tf"
        - "../../modules/eks-karpenter/**/*.tf"
      enabled: true

  - name: authentik
    dir: terraform/foundation/authentik
    apply_requirements:
      - approved
      - mergeable
    autoplan:
      when_modified:
        - "**/*.tf"
      enabled: true

  - name: website
    dir: terraform/foundation/website
    apply_requirements:
      - approved
      - mergeable
    autoplan:
      when_modified:
        - "**/*.tf"
      enabled: true

  - name: infrastructure-as-bot
    dir: terraform/foundation/infrastructure-as-bot
    apply_requirements:
      - approved
      - mergeable
    autoplan:
      when_modified:
        - "**/*.tf"
      enabled: true

  - name: prod-website
    dir: terraform/environments/prod/website
    apply_requirements:
      - approved
      - mergeable
    autoplan:
      when_modified:
        - "**/*.tf"
      enabled: true

  - name: caddy
    dir: terraform/foundation/caddy
    apply_requirements:
      - approved
      - mergeable
    autoplan:
      when_modified:
        - "**/*.tf"
      enabled: true

  - name: atlantis
    dir: terraform/foundation/atlantis
    apply_requirements:
      - approved
      - mergeable
    autoplan:
      when_modified:
        - "**/*.tf"
      enabled: true
