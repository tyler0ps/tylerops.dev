crds:
  enabled: true

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: karpenter.sh/controller
              operator: In
              values:
                - "true"

tolerations:
  - key: CriticalAddonsOnly
    operator: Exists

webhook:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: karpenter.sh/controller
                operator: In
                values:
                  - "true"
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

cainjector:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: karpenter.sh/controller
                operator: In
                values:
                  - "true"
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

serviceAccount:
  annotations:
    # Injected by terraform helm_release set{} — do not hardcode here
    eks.amazonaws.com/role-arn: ""
