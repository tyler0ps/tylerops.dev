server:
  replicas: 1
  extraArgs:
    - --insecure # TLS terminated at Envoy Gateway
  ingress:
    enabled: false
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: argocd-server
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring

repoServer:
  replicas: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: argocd-repo-server
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring

controller:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring

applicationSet:
  replicas: 1
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring

configs:
  cm:
    url: https://gitops.tylerops.dev
    dex.config: |
      connectors:
      - config:
          issuer: https://auth.tylerops.dev/application/o/argo-cd-application/
          clientID: E3u6xGhbc3vpqRJa1wXaRQYL2wCGDTOgCDItxVOD
          clientSecret: $dex.authentik.clientSecret
          insecureEnableGroups: true
          scopes:
            - openid
            - profile
            - email
        name: authentik
        type: oidc
        id: authentik

  rbac:
    policy.default: role:readonly
    policy.csv: |
      g, argocd-admins, role:admin

  # secret.extra passed via --set-json at install time (dots in keys break --set)
