cluster:
  name: eks-cilium
ipam:
  mode: eni
eni:
  enabled: true
  awsEnablePrefixDelegation: true
kubeProxyReplacement: "true"
k8sServiceHost: "BC0381C164FD2198E74EAD93DCC8AAC7.gr7.ap-southeast-1.eks.amazonaws.com"
k8sServicePort: 443
routingMode: native
operator:
  replicas: 1
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: Exists
    - key: "node-role.kubernetes.io/master" #deprecated
      operator: Exists
    - key: "node.kubernetes.io/not-ready"
      operator: Exists
    - key: "node.cloudprovider.kubernetes.io/uninitialized"
      operator: Exists
    - key: "CriticalAddonsOnly"
      operator: "Exists"
      effect: "NoSchedule"
