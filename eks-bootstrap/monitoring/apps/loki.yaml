apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: "6.53.0"
    helm:
      valuesObject:
        loki:
          auth_enabled: false

          commonConfig:
            replication_factor: 1

          storage:
            type: s3
            bucketNames:
              chunks: tylerops-loki-chunks
              ruler: tylerops-loki-chunks
            s3:
              region: ap-southeast-1
              s3ForcePathStyle: false

          storage_config:
            aws:
              region: ap-southeast-1
              bucketnames: tylerops-loki-chunks
              s3forcepathstyle: false

          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h

          pattern_ingester:
            enabled: true

          limits_config:
            retention_period: 30d
            ingestion_rate_mb: 8
            ingestion_burst_size_mb: 16
            max_streams_per_user: 10000
            allow_structured_metadata: true

          compactor:
            retention_enabled: true
            delete_request_store: s3

        deploymentMode: SingleBinary

        singleBinary:
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          persistence:
            enabled: true
            storageClass: gp2
            size: 10Gi
          podAnnotations:
            karpenter.sh/do-not-disrupt: "true"

        serviceAccount:
          name: loki
          annotations:
            # IRSA role — deterministic from cluster name + account ID
            eks.amazonaws.com/role-arn: "arn:aws:iam::382027875658:role/eks-foundation-loki"

        minio:
          enabled: false

        chunksCache:
          enabled: true
          allocatedMemory: 900
          resources:
            requests:
              cpu: 50m
              memory: 1Gi
            limits:
              memory: 1Gi

        resultsCache:
          enabled: true
          allocatedMemory: 100
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 128Mi

        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
        ingester:
          replicas: 0
        querier:
          replicas: 0
        queryFrontend:
          replicas: 0
        queryScheduler:
          replicas: 0
        distributor:
          replicas: 0
        compactor:
          replicas: 0
        indexGateway:
          replicas: 0
        bloomCompactor:
          replicas: 0
        bloomGateway:
          replicas: 0
        gateway:
          enabled: false

        lokiCanary:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
