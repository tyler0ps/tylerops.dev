apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "72.3.0"
    helm:
      valuesObject:
        # ---- Grafana ----
        grafana:
          enabled: true
          ingress:
            enabled: false # using HTTPRoute instead

          # Mount grafana-oauth Kubernetes Secret as env vars.
          # Terraform creates this secret with GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET.
          envFromSecret: "grafana-oauth"

          grafana.ini:
            server:
              domain: monitoring.tylerops.dev
              root_url: https://monitoring.tylerops.dev
            auth:
              disable_login_form: false # keep for emergency breakglass access
              signout_redirect_url: https://auth.tylerops.dev/application/o/grafana/end-session/
            auth.generic_oauth:
              enabled: true
              name: Authentik
              client_id: E3u6xGhbc3vpqRJa1wXaRQYL2wCGDTOgCDItxVOD
              client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
              scopes: openid email profile groups
              auth_url: https://auth.tylerops.dev/application/o/grafana/authorize/
              token_url: https://auth.tylerops.dev/application/o/grafana/token/
              api_url: https://auth.tylerops.dev/application/o/userinfo/
              # Map Authentik group 'grafana-admins' → Grafana Admin; everyone else → Viewer
              role_attribute_path: "contains(groups[*], 'grafana-admins') && 'Admin' || 'Viewer'"
              allow_sign_up: true
            analytics:
              check_for_updates: false
              reporting_enabled: false

          additionalDataSources:
            - name: Loki
              type: loki
              url: http://loki.monitoring.svc.cluster.local:3100
              access: proxy
              isDefault: false

          sidecar:
            dashboards:
              enabled: true
              searchNamespace: ALL

          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: argocd
                  folder: ArgoCD
                  type: file
                  options:
                    path: /var/lib/grafana/dashboards/argocd

          dashboards:
            argocd:
              argocd-operational-overview:
                gnetId: 19993
                revision: 3
                datasource: Prometheus

        # ---- Prometheus ----
        prometheus:
          prometheusSpec:
            retention: 15d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp2
                  resources:
                    requests:
                      storage: 20Gi
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            podMetadata:
              annotations:
                karpenter.sh/do-not-disrupt: "true"

        # ---- AlertManager ----
        alertmanager:
          alertmanagerSpec:
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp2
                  resources:
                    requests:
                      storage: 5Gi

        nodeExporter:
          enabled: true

        kubeStateMetrics:
          enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # required: Prometheus Operator CRDs exceed client-side apply limit
