apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "82.9.0"
    helm:
      valuesObject:
        # ---- Grafana ----
        grafana:
          enabled: true
          ingress:
            enabled: false # using HTTPRoute instead

          # Client secret from Kubernetes Secret created by Terraform
          envFromSecret: "grafana-oauth"

          grafana.ini:
            server:
              root_url: "https://monitoring.tylerops.dev"
            auth:
              signout_redirect_url: "https://auth.tylerops.dev/application/o/grafana/end-session/"
              oauth_auto_login: true
            auth.generic_oauth:
              name: authentik
              enabled: true
              client_id: "SE4ynzuA9hAgQ3HFbNkg9TbPQ0Tu47CJGUpC8r2Z"
              client_secret: "$__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}"
              scopes: "openid profile email"
              auth_url: "https://auth.tylerops.dev/application/o/authorize/"
              token_url: "https://auth.tylerops.dev/application/o/token/"
              api_url: "https://auth.tylerops.dev/application/o/userinfo/"
              role_attribute_path: "contains(groups[*], 'grafana-admins') && 'Admin' || contains(groups[*], 'grafana-editors') && 'Editor' || 'Viewer'"
            analytics:
              check_for_updates: false
              reporting_enabled: false

          additionalDataSources:
            - name: Loki
              type: loki
              url: http://loki.monitoring.svc.cluster.local:3100
              access: proxy
              isDefault: false

          sidecar:
            dashboards:
              enabled: true
              searchNamespace: ALL

          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: argocd
                  folder: ArgoCD
                  type: file
                  options:
                    path: /var/lib/grafana/dashboards/argocd

          dashboards:
            argocd:
              argocd-operational-overview:
                gnetId: 19993
                revision: 3
                datasource: Prometheus

        # ---- Prometheus ----
        prometheus:
          prometheusSpec:
            retention: 15d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp2
                  resources:
                    requests:
                      storage: 20Gi
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            podMetadata:
              annotations:
                karpenter.sh/do-not-disrupt: "true"

        # ---- AlertManager ----
        alertmanager:
          alertmanagerSpec:
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp2
                  resources:
                    requests:
                      storage: 5Gi

        nodeExporter:
          enabled: true

        prometheus-node-exporter:
          tolerations:
            - operator: Exists
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: karpenter.sh/nodepool
                        operator: Exists

        kubeStateMetrics:
          enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # required: Prometheus Operator CRDs exceed client-side apply limit
