apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "72.3.0"
    helm:
      valuesObject:
        # ---- Grafana ----
        grafana:
          enabled: true
          ingress:
            enabled: false # using HTTPRoute instead

          # OAuth config via env vars (recommended by Authentik docs for Helm).
          # Non-sensitive vars set here; client_secret comes from grafana-oauth Secret.
          env:
            GF_SERVER_ROOT_URL: "https://monitoring.tylerops.dev"
            GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
            GF_AUTH_GENERIC_OAUTH_NAME: "authentik"
            GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "E3u6xGhbc3vpqRJa1wXaRQYL2wCGDTOgCDItxVOD"
            GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email"
            GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://auth.tylerops.dev/application/o/authorize/"
            GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "https://auth.tylerops.dev/application/o/token/"
            GF_AUTH_GENERIC_OAUTH_API_URL: "https://auth.tylerops.dev/application/o/userinfo/"
            GF_AUTH_SIGNOUT_REDIRECT_URL: "https://auth.tylerops.dev/application/o/grafana/end-session/"
            GF_AUTH_OAUTH_AUTO_LOGIN: "true"
            # 'grafana-admins' → Admin, 'grafana-editors' → Editor, everyone else → Viewer
            GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'grafana-admins') && 'Admin' || contains(groups[*], 'grafana-editors') && 'Editor' || 'Viewer'"

          # Client secret from Kubernetes Secret created by Terraform
          envFromSecret: "grafana-oauth"

          grafana.ini:
            analytics:
              check_for_updates: false
              reporting_enabled: false

          additionalDataSources:
            - name: Loki
              type: loki
              url: http://loki.monitoring.svc.cluster.local:3100
              access: proxy
              isDefault: false

          sidecar:
            dashboards:
              enabled: true
              searchNamespace: ALL

          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: argocd
                  folder: ArgoCD
                  type: file
                  options:
                    path: /var/lib/grafana/dashboards/argocd

          dashboards:
            argocd:
              argocd-operational-overview:
                gnetId: 19993
                revision: 3
                datasource: Prometheus

        # ---- Prometheus ----
        prometheus:
          prometheusSpec:
            retention: 15d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp2
                  resources:
                    requests:
                      storage: 20Gi
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            podMetadata:
              annotations:
                karpenter.sh/do-not-disrupt: "true"

        # ---- AlertManager ----
        alertmanager:
          alertmanagerSpec:
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp2
                  resources:
                    requests:
                      storage: 5Gi

        nodeExporter:
          enabled: true
          tolerations:
            - operator: Exists
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: karpenter.sh/nodepool
                        operator: Exists

        kubeStateMetrics:
          enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # required: Prometheus Operator CRDs exceed client-side apply limit
