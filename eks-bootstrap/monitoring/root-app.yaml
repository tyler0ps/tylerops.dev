apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://github.com/tyler0ps/tylerops.dev
    targetRevision: feature/eks-monitoring
    path: eks-bootstrap/monitoring/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd # child Application manifests land in argocd namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
