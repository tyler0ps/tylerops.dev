replicaCount: 1

clusterName: eks-foundation
region: ap-southeast-1

resources: 
  limits:
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Injected by terraform helm_release set{} — do not hardcode here
vpcId: ""

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: karpenter.sh/controller
              operator: In
              values:
                - "true"

tolerations:
  - key: CriticalAddonsOnly
    operator: Exists

serviceAccount:
  name: aws-load-balancer-controller
  # No annotation needed — Pod Identity handles IAM
